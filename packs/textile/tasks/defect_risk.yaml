id: textile.defect_risk
type: risk
title: 불량 위험
entity: lot
time_key: recorded_at
group_key: null
target: {name: defect, positive: 1}
features: [set_temp, set_pressure, line_speed, ink_usage, dwell_time, absorb_rate, fabric_strength, print_type, color_tone]
thresholds: {review_prob: 0.5}
calibration: {method: none}
candidates: [logreg, rf_clf, gbc]
candidate_params:
  logreg: {max_iter: 1000}
  rf_clf: {n_estimators: 100, min_samples_leaf: 5}
  gbc: {n_estimators: 80, max_depth: 2}
split: time_60_20_20
out_of_range: predict_with_warning
max_imputed: 3
approver_role: quality
seed: 42
