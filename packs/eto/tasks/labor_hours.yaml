# 대당 제조공수 회귀 (task-contract §6.5 · source_inventory §11.3). 원천: 행 순서 540/180/180 · 검증 MAE 선정 · 학습+검증 재적합 · 시험 1회.
# 원천에 시각 열이 없다 → 표준 random_60_20_20 (D2-21, 원천 분할과 다른 사유는 이관 보고서).
id: eto.labor_hours
type: regression
title: 대당 제조공수 예측
entity: job
time_key: null
group_key: null
target: {name: labor_hours, unit: h, direction: lower_is_better}
features: [total_mass_kg, cut_m, weld_m, thickness_mm, complexity, main_material, product_family]
thresholds: {}                  # 원천에 회귀 검토 기준 없음
clip: {min: 0.1}                # 원천 predict_hours: max(.1, …)
interval: {method: split_conformal, alpha: 0.1}
candidates: [ridge, random_forest, extra_trees, gbr]
candidate_params:
  ridge: {alpha: 1}
  random_forest: {n_estimators: 100, min_samples_leaf: 2}
  extra_trees: {n_estimators: 100, min_samples_leaf: 2}
  gbr: {n_estimators: 160, max_depth: 3}
split: random_60_20_20
out_of_range: predict_with_warning
max_imputed: 3
approver_role: estimating_lead
seed: 42
