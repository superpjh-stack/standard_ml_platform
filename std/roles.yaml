# 역할 · 권한 기본값 (goal §6 — G-M11 의 기대값). 화면 · API 접근의 유일한 출처.
roles: [viewer, operator, approver, admin]
# 값: allow | read | deny | own_task(자기 approver_role 과제만)
permissions:
  overview:      {screen: 1, apis: ["GET /tenants/{t}/tasks", "GET /tenants/{t}/tasks/{task}", "GET .../overview", "GET .../records"],
                  admin: allow, approver: allow, operator: allow, viewer: allow}
  predict:       {screen: 2, apis: ["POST .../predict", "POST .../predict:batch", "POST .../actuals"],
                  admin: allow, approver: allow, operator: allow, viewer: deny}
  optimize:      {screen: 3, apis: ["POST .../optimize"],
                  admin: allow, approver: allow, operator: allow, viewer: deny}
  train:         {screen: 4, apis: ["POST .../train", "GET /runs/{id}", "GET .../models", "POST .../models/{v}/stage"],
                  admin: allow, approver: read, operator: deny, viewer: deny}
  approve:       {screen: 5, apis: ["GET .../approvals", "POST /approvals/{id}/decide", "POST .../models/{v}/promote", "POST .../models/{v}/rollback"],
                  admin: allow, approver: own_task, operator: read, viewer: deny}
  monitor:       {screen: 6, apis: ["GET .../monitor", "GET /doctor"],
                  admin: allow, approver: allow, operator: read, viewer: deny}
  trace:         {screen: null, apis: ["GET /predictions/{id}/trace", "audit"],
                  admin: allow, approver: deny, operator: deny, viewer: deny}
notes:
  - "staging 승격(ML 담당)은 1차에서 admin 이 맡는다. 별도 ml_engineer 역할은 표준 변경 요청 대상 (goal §6)."
  - "다른 회사 키로의 접근은 403 이 아니라 404 not_found (존재 여부 숨김)."
  - "model_version 지정(staging 예측)은 approver 이상 (spec §7.1)."
