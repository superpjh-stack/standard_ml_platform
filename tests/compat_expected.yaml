# 호환 라우터 기대값 — 원천 저장소 파일을 **읽어서** 옮긴 것(실행하지 않음). 개발2 시험 데이터(tests/test_compat.py).
# 근거는 각 항목의 src(파일:줄). 원천은 고치지 않는다. 표준이 다르게 정한 것은 differs 에 사유와 함께 둔다.
ks:
  source_repo: "../KwangSung ML AI"
  routes:                                        # api/main.py:71,76,81,86,91,102
    health: /api/health
    predict: /api/maintenance/predict
    optimize: /api/ml/optimize
    overview: /api/ml/overview
    records: /api/data/records
  predict_keys: [remaining_hours, risk_probability, anomaly, status, warnings, imputed_fields, model, risk_model, version, notice]   # api/ml_service.py:127-129
  round: {remaining_hours: 2, risk_probability: 4}                                   # api/ml_service.py:127
  status_text: {review: 점검 검토, ok: 추가 징후 없음}                                  # api/ml_service.py:128
  request_rename: {machine: machine_code, product: product_type}                     # api/main.py:42-51 (D-34)
  default_record: {press_force: 245, vibration: 2.1, motor_current: 48, equip_temp: 47, mold_temp: 39, cycle_time: 9.5, shot_count: 65000, machine: PRS-01, product: FRONT SHELL}   # tests/test_api.py:17-18 · api/config.py:6-14
  invalid_422: [[vibration, -1], [equip_temp, 90], [machine, PRS-18], [product, 김치], [shot_count, 12345.5]]   # tests/test_api.py:38
  missing_ok: [vibration, mold_temp, motor_current]          # tests/test_api.py:44-50 (3개 결측 200, 4개째 422)
  missing_fail_extra: equip_temp
  optimize_keys: [feasible, prediction, candidate_count, feasible_count, recommendation, alternatives, unmet_constraints, objective, notice]   # api/ml_service.py:146-148
  optimize_params: {reserve_hours: 12, max_delay_hours: 48, max_cost_index: 140}     # tests/test_api.py:79
  optimize_infeasible: {reserve_hours: 150, max_cost_index: 1}                       # tests/test_api.py:86
  optimize_candidate_count: 97                                                       # tests/test_api.py:82
  optimize_invalid_422: [[reserve_hours, 0], [max_delay_hours, 73], [max_cost_index, 0]]   # tests/test_api.py:100
  overview_keys: [data_mode, version, rows, champion, risk_champion, metrics, risk_metrics, test_metrics, risk_test_metrics, split, features]   # api/ml_service.py:160-169 (부분)
  overview_metric_keys: [model, mae, rmse, r2]                                       # api/ml_service.py:50
  overview_risk_metric_keys: [model, roc_auc, pr_auc, brier]                         # api/ml_service.py:54
  split: {train: 432, validation: 144, test: 144}                                    # api/ml_service.py:166 · tests/test_api.py:25
  records_keys: [total, limit, offset, records]                                      # api/main.py:99
  record_detail_keys: [record, source]                                               # api/main.py:107
  records_bad_queries: ["limit=0", "limit=101", "offset=-1", "machine=PRS-18", "product=invalid", "search=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]   # tests/test_api.py:63
  records_total: 720
  health_keys: [status, model_ready, data_mode, version]                             # api/main.py:73
  error_shape: detail_list                                                           # api/main.py:25-31 {"detail": [{loc, msg, type}]}
  differs:
    model: "옛 응답은 표시 이름(Gradient Boosting), 표준은 후보 코드(gbr) — std/candidates.yaml"
    version: "옛 MODEL_VERSION 상수(api/config.py:3), 표준은 등록부 버전(v<n>) — 코드 안 버전 상수 금지"
    warnings: "문구는 표준 경고 메시지(+ 변수 라벨). 보정 한 줄 문구만 옛 형식"
