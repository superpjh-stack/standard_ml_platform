    model: "표시 이름 ↔ 후보 코드"
    version: "옛 상수 ↔ 등록부 버전"
    overview: "시험 구간 행 단위 예측에서 만든 키(equipment 의 LOT별 예측 · review_count · trend · priority_queue)와 데모 검토 기준 상수(delta_e_review · defect_rate 는 합성 라벨 비율)는 내지 않는다 — 표준 API 는 시험 구간을 다시 채점하지 않고(goal §8), 검토 기준은 과제 thresholds(B02 tasks) 가 정본이다. 표준 자리 = 화면 4 학습 보고서 · 화면 1 개요(B06) · B02 과제 정의"
    overview_omitted: [equipment, review_count, trend, priority_queue, delta_e_review, defect_rate]
    importance: "옛 importance 는 검증 구간, 표준은 시험 구간 순열 중요도(report.test.permutation_importance)"
