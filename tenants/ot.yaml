# 회사 등록부 — 원터치 (contracts/tenant-contract.md §3). 비밀값은 환경변수 이름만. 확인 못 한 값은 null + "# 미확인".
code: ot
name: 원터치
pack: rollform-quote
mode: demo                      # 실데이터 키가 들어오기 전 live 없음 (D-13 · G2-L01)
hub_company: ot
aliases: [OneTouch]             # 금지어 검사용 별칭 (G-M01 · G-S06)
tasks:
  enable: [ot.machining_minutes, ot.cad_objects, ot.quote]
categories:                     # values_from: tenant 범주 — 원천 api/config.py:4-9 (목록 순서 = 원천 순서, 합성 효과가 위치에 묶임)
  steel_grade: [SPCC, SS400, SUS304]
  section_profile: [잔넬, T바, 각관, C형강]
sources:
  demo:    {kind: synthetic, seed: 42, rows: 900}   # 원천 SEED 42 · 작업 900 (config.py:2 · ml_service.py:45). 객체 설명자 1,600 은 팩 synth.tasks
  eval:    {kind: csv, path: tests/fixtures/ot/snapshot.csv}   # migration/make_fixtures.py 생성 (demo 와 같은 작업 행)
feature_map: {}                 # 미확인 — 실 MES · ERP 열 대응 없음 (D-32)
target_map: {}                  # 미확인 — 가공시간 실측 원천 없음 (D-33)
unmapped: {}
approvers: {estimating_lead: []}   # 미확인 — 사람 확인 필요 (D-04)
notify: {webhook_env: null}        # 미확인
compat:
  entity_prefix: "OT-SYN-"      # 원천 job_id 접두 (api/ml_service.py:55)
  input_rename: {length: part_length_mm, width: blank_width_mm, thickness: sheet_thickness_mm, holes: hole_count,
                 slots: slot_count, bends: bend_count, material: steel_grade, profile: section_profile}   # 옛 요청 키 → 팩 변수
  # 옛 경로(routes)와 옛 응답 모양(tenants/ot/compat.py)은 개발2. 팩 샘플 도면 = packs/rollform-quote/samples/sample.dxf
  overview_values: {profiles: section_profile}   # 옛 개요 profiles ← 회사 범주 (ml_service.py:36 PROFILES)
  routes:                       # 옛 경로 (원천 api/main.py:47-127 · api-contract §6.3)
    - {path: /api/health, action: health}                                                          # :47
    - {path: /api/ml/overview, action: overview}                                                   # :52
    - {path: /api/cad/sample.dxf, action: pack_file, params: {file: sample.dxf, media_type: application/dxf}}   # :69
    - {path: /api/cad/demo, method: POST, action: document_demo, task: cad_objects, params: {file: sample.dxf}}  # :74
    - {path: /api/cad/analyze, method: POST, action: document_upload, task: cad_objects}          # :82
    - {path: "/api/cad/{drawing_id}", action: document_get, task: cad_objects}                     # :94
    - {path: /api/quotes, method: POST, action: quote_create, task: quote}                         # :101 (draft 만 — 확정은 표준 경로 · 승인)
    - {path: /api/quotes, method: GET, action: quote_list, task: quote, params: {limit: 10, max_limit: 100, search_max: 80}}   # :109
    - {path: "/api/quotes/{quote_id}", action: quote_get, task: quote}                             # :114
    - {path: "/api/quotes/{quote_id}/csv", action: quote_get, task: quote, shape: old_quote_csv}  # :126
    # /api/data/demo (:56) 는 팩 rollform-quote samples/ 에 20행 참조 데이터(demo.json)가 생기면 pack_file 로 (개발3 요청)
labels: {}
