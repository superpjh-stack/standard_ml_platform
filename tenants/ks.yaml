# 회사 등록부 — 광성정밀 (contracts/tenant-contract.md). 비밀값은 환경변수 이름만. 확인 못 한 값은 null + "# 미확인".
code: ks
name: 광성정밀
pack: press
mode: demo                      # 1차 루프는 demo/eval 만 (D-13)
hub_company: ks
aliases: [광성, KwangSung]      # 코어 · 팩 금지어 검사용 별칭 (G-M01 · G-S06)
tasks:
  enable: [ks.remaining_hours, ks.failure_24h, ks.sensor_ood, ks.maintenance_timing]
categories:                     # values_from: tenant 범주 (원천 config.py:4-5)
  machine_code: [PRS-01, PRS-02, PRS-03, PRS-04]
  product_type: [FRONT SHELL, CENTER PLATE, DIAPHRAGM PLATE]
sources:
  demo:    {kind: synthetic, seed: 42}
  eval:    {kind: csv, path: tests/fixtures/ks/snapshot.csv}          # migration/make_fixtures.py 생성 (demo 와 같은 행)
  train:   {kind: dataplatform, view: null, url_env: MLP_KS_DP_URL, key_env: MLP_KS_DP_KEY}   # 뷰 이름 미확인
  gateway: {kind: gateway, table: EIF_PLC_RAW, dsn_env: MLP_KS_GW_RO_DSN}
  actuals: {kind: mes, tables: [PRS_PROCESS_DATA, PRS_MOLD_SHOTS, BAS_EQUIPMENTS], dsn_env: MLP_KS_MES_RO_DSN}   # 목표(정비 · 고장 이력) 테이블 미확인 — D-33
feature_map:                    # 원천 열 → 팩 변수 (source_inventory §4)
  PRS_PROCESS_DATA.PRESS_FORCE_TON: press_force
  PRS_PROCESS_DATA.MOLD_TEMP_C: mold_temp
  PRS_PROCESS_DATA.VIBRATION_MMS: vibration
  PRS_PROCESS_DATA.CYCLE_TIME_SEC: cycle_time
  PRS_MOLD_SHOTS.ACC_SHOT_CNT: shot_count
  BAS_EQUIPMENTS.EQUIP_CODE: machine_code
target_map: {}                  # 미확인 — remaining_hours · failure_24h 실측 원천 없음 (D-33)
unmapped:
  motor_current: "PRC_SENSOR_DATA.MEASURE_ITEM 항목 코드 미확인"
  equip_temp: "PRC_SENSOR_DATA.MEASURE_ITEM 항목 코드 미확인"
  product_type: "PRODUCT_LOT_NO → 품목 결합 경로 미확인"
approvers: {maintenance_lead: []}   # 미확인 — 사람 확인 필요 (D-04)
notify: {webhook_env: null}         # 미확인
compat:
  entity_prefix: "KS-DEMO-"
  model_version_label: null         # 원천 MODEL_VERSION 상수는 옮기지 않는다 — 호환 응답의 version 은 등록부 버전
  routes: [/api/health, /api/maintenance/predict, /api/ml/optimize, /api/ml/overview, /api/data/records]
  status_text: {review: 점검 검토, ok: 추가 징후 없음}
  input_rename: {machine: machine_code, product: product_type}   # 옛 요청 키 → 팩 변수
labels: {}
