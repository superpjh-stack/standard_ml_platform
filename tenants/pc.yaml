# 회사 등록부 — 평창꽃순이김치 (contracts/tenant-contract.md §3). 비밀값은 환경변수 이름만. 확인 못 한 값은 null + "# 미확인".
code: pc
name: 평창꽃순이김치
pack: kimchi
mode: demo                      # 실데이터 키가 들어오기 전 live 없음 (D-13 · G2-L01)
hub_company: pc
aliases: [PyoungChang, 꽃순이김치]   # 금지어 검사용 별칭 (G-M01 · G-S06) — 지명 '평창' 단독은 산지 범주값이라 별칭에 두지 않는다
tasks:
  enable: [pc.sensory_score, pc.recipe_optimize, pc.residual_review]
categories:                     # values_from: tenant 범주 — 원천 api/ml_service.py:46 (목록 순서 = 원천 순서, 합성 효과가 위치에 묶임)
  cabbage_origin: [평창, 강릉, 기타계약]
  prod_line: [K1, K2]
sources:
  demo:    {kind: synthetic, seed: 42, rows: 420}   # 원천 SEED 42 · rows 420 (api/ml_service.py:19,36)
  eval:    {kind: csv, path: tests/fixtures/pc/snapshot.csv}   # migration/make_fixtures.py 생성 (demo 와 같은 행)
feature_map: {}                 # 미확인 — 실 MES · Data Platform 열 대응 없음 (D-32)
target_map: {}                  # 미확인 — 관능 점수 실측 원천 없음 (D-33)
unmapped: {}
approvers: {quality_lead: []}   # 미확인 — 사람 확인 필요 (D-04)
notify: {webhook_env: null}     # 미확인
compat:
  entity_prefix: "PC-K-"        # 원천 lot_id 접두 (api/ml_service.py:50)
  input_rename: {line: prod_line}   # 옛 요청 키 → 팩 변수 (api/main.py:16 ProcessInput.line)
  routes:                       # 옛 경로 (원천 api/main.py:27-59 · api-contract §6.3) — 모양은 tenants/pc/compat.py (개발2)
    - {path: /api/health, action: health}                                                          # :27
    - {path: /api/ml/overview, action: overview}                                                   # :30
    - {path: /api/quality/predict, method: POST, action: predict_one, task: sensory_score}        # :39
    - {path: /api/quality/overview, action: review_list, task: residual_review, params: {limit: 50, max_limit: 50}}   # :42
    - {path: /api/data/records, action: records}                                                   # :49
    # /api/ml/optimize (:36) 는 pc.recipe_optimize 가 켜지면 (웨이브 A2 — 개발1 팩 kimchi)
labels: {}
